<!doctype html>
<meta charset="utf-8"><title>tests</title>
<pre id="o"></pre>
<script type="module">
import { parseJson } from './js/llm.js';
import { loadAttack, validate } from './js/attack.js';
import { linkState, extractTechniques, tagDiff } from './js/mapping.js';
import { config, redact } from './js/llm.js';
import { setAuthorized, setKey, getKey, clearKeys, isAuthorized } from './js/keys.js';
import { state, save } from './js/store.js';
import { coverageMap, status } from './js/coverage.js';
const backup = Object.fromEntries(Object.keys(localStorage).map(k => [k, localStorage.getItem(k)])); // les tests ne doivent pas toucher aux projets de l'utilisateur
await loadAttack();
const t = (n, c) => o.textContent += `${c ? 'OK  ' : 'FAIL'} ${n}\n`;
t('json fence', parseJson('Voici:\n```json\n{"a":[1]}\n```\nfin').a[0] === 1);
t('json array', parseJson('x [1,2] y').length === 2);
const v = validate(['t1059.001', 'T9999', 'T1059.001']);
t('validate ok dedup + case', v.ok.length === 1 && v.ok[0] === 'T1059.001');
t('validate rejects', v.rejected[0] === 'T9999');
const S = { id: 's1', techniques: ['T1059', 'T1003.001'] };
t('linkState ok (sous-technique vs parent)', linkState({ techniques: ['T1059.001'], scenarios: ['s1'] }, S) === 'ok');
t('linkState suspect', linkState({ techniques: ['T1490'], scenarios: ['s1'] }, S) === 'suspect');
t('linkState miss', linkState({ techniques: ['T1003.002'], scenarios: [] }, S) === 'miss');
t('linkState vide', linkState({ techniques: ['T1490'], scenarios: [] }, S) === '');
// --- mapping déterministe depuis les tags ---
t('tags Sigma', extractTechniques(`tags:
  - attack.execution
  - attack.t1059.001
  - attack.g0016`).join() === 'T1059.001');
t('champs Sentinel/Elastic + dédoublonnage + ID inconnu ignoré', extractTechniques('{"relevantTechniques":["T1003","T1003"],"threat":{"technique":{"id":"T1490"}},"x":"T9999"}').join() === 'T1003,T1490');
t('pas de tag', extractTechniques(`title: Rclone
detection: x`).length === 0);
t('écart tags / IA', JSON.stringify(tagDiff(['T1569.002'], ['T1021.002'])) === '{"tags":["T1569.002"],"ia":["T1021.002"]}');
t('pas d’écart si même parent', tagDiff(['T1059.001'], ['T1059']) === null);
// --- CYBAIMaker : approbation, clés, validation de configuration ---
const code = f => { try { f(); return 'ok'; } catch (e) { return e.code; } };
const set = o => Object.assign(state.settings, { provider: 'local', base: 'http://127.0.0.1:11434/v1', model: 'auto', deployment: '', apiVersion: '2024-10-21' }, o);
clearKeys(); setAuthorized(false); set({});
t('refus tant que non autorisé', code(() => config('generate')) === 'not_authorized');
setAuthorized(true);
t('local http loopback accepté sans clé', code(() => config('generate')) === 'ok');
set({ provider: 'openai', base: 'https://api.openai.com/v1', model: 'gpt-4o' });
t('clé manquante (openai)', code(() => config('generate')) === 'missing_key');
setKey('openai', 'sk-test-SECRET-1234');
t('clé présente → ok', code(() => config('generate')) === 'ok');
t('clé par fournisseur (pas partagée)', getKey('anthropic') === '');
set({ provider: 'openai', base: 'http://api.example.com/v1', model: 'gpt-4o' });
t('HTTP distant refusé', code(() => config('generate')) === 'insecure_url');
set({ provider: 'openai', base: 'pas une url', model: 'gpt-4o' });
t('URL invalide', code(() => config('generate')) === 'bad_url');
set({ provider: 'openai', base: 'https://api.openai.com/v1', model: '' });
t('modèle manquant', code(() => config('generate')) === 'missing_model');
t('modèle non exigé pour lister', code(() => config('models')) === 'ok');
set({ provider: 'openai', base: ' https://x.example.com/v1/chat/completions/ ', model: 'm' });
t('URL de base normalisée', config('generate').base === 'https://x.example.com/v1');
setKey('azure', 'azure-key-9999'); set({ provider: 'azure', base: 'https://r.openai.azure.com', model: '' });
t('azure : déploiement manquant', code(() => config('generate')) === 'missing_deployment');
set({ provider: 'azure', base: 'https://r.openai.azure.com', deployment: 'gpt4o' });
t('azure ok avec déploiement', code(() => config('generate')) === 'ok');
t('redact clé + Bearer', !/SECRET|abc123/.test(redact('erreur sk-test-SECRET-1234 et Bearer abc123xyz', 'sk-test-SECRET-1234')));
set({ provider: 'openai', base: 'https://api.openai.com/v1', model: 'm' });
try { setKey('openai', ''); config('test'); } catch (e) { t('erreur contextualisée (op, fournisseur), sans secret', /test · OpenAI/.test(e.message) && e.provider === 'openai' && e.op === 'test'); }
setKey('openai', 'k-in-session'); t('clé en sessionStorage, pas en localStorage', !!sessionStorage.getItem('mitremapper.keys') && !(localStorage.getItem('mitremapper.keys') || '').includes('k-in-session'));
t('aucune clé dans les données projet', !JSON.stringify(state).includes('k-in-session'));
clearKeys(); setAuthorized(false);
t('clés effacées', getKey('openai') === '' && !isAuthorized());
// --- statut de couverture (partiel par sous-techniques) ---
const st = (rules, id) => status(coverageMap(rules), id);
t('parent couvert seulement via 1 sous-technique → partiel', st([{ techniques: ['T1059.001'], confidence: 'high' }], 'T1059') === 'part');
t('sous-technique citée → couvert', st([{ techniques: ['T1059.001'], confidence: 'high' }], 'T1059.001') === 'cov');
t('sous-technique sœur → trou', st([{ techniques: ['T1059.001'], confidence: 'high' }], 'T1059.002') === 'gap');
t('règle sur le parent → parent couvert, sous-technique partielle', st([{ techniques: ['T1059'], confidence: 'medium' }], 'T1059') === 'cov' && st([{ techniques: ['T1059'], confidence: 'medium' }], 'T1059.002') === 'part');
t('confiance basse → partiel', st([{ techniques: ['T1490'], confidence: 'low' }], 'T1490') === 'part');
t('technique sans sous-technique couverte → couvert', st([{ techniques: ['T1490'], confidence: 'high' }], 'T1490') === 'cov');
// --- références de scénarios stables ---
const sc0 = state.scenarios;
state.scenarios = [{ id: 'a' }, { id: 'b' }, { id: 'c' }]; save();
t('références initiales S1..S3', state.scenarios.map(s => s.ref).join() === '1,2,3');
state.scenarios = state.scenarios.filter(s => s.id !== 'b'); state.scenarios.push({ id: 'd' }); save();
t('suppression puis ajout : pas de renumérotation ni de réutilisation', state.scenarios.map(s => s.ref).join() === '1,3,4');
state.scenarios = [{ id: 'x' }, { id: 'y' }]; save();
t('liste remplacée → renumérotée depuis S1', state.scenarios.map(s => s.ref).join() === '1,2');
state.scenarios = sc0;
localStorage.clear(); for (const [k, v] of Object.entries(backup)) localStorage.setItem(k, v);
const fails = (o.textContent.match(/^FAIL/gm) || []).length, oks = (o.textContent.match(/^OK/gm) || []).length;
o.textContent += `
${fails ? 'ÉCHEC' : 'SUCCÈS'} : ${oks} OK, ${fails} FAIL
`;
document.title = fails ? `FAIL ${fails}` : `PASS ${oks}`;
</script>
