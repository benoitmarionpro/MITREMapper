*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:Poppins,system-ui,sans-serif;line-height:1.3}
h2{font-size:1.05rem;margin:1.6rem 0 .5rem;color:var(--indigo-600)}
a{color:var(--acc)}
header{background:var(--brand);color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,.2);display:flex;align-items:center;gap:1rem;padding:0 2rem;height:56px}
h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
h1 small{font-weight:400;font-size:12px;color:rgba(255,255,255,.55);margin-left:.5rem}
#proj{margin-left:auto;font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22rem}
#ver{margin-left:1rem;font-size:12px;color:rgba(255,255,255,.55);white-space:nowrap}
nav{display:flex;gap:4px;padding:0 .5rem;overflow-x:auto}
nav button{border:0;background:transparent;color:rgba(255,255,255,.65);padding:6px 14px;border-radius:999px;font:500 12.5px Inter,sans-serif;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
nav button:hover{background:rgba(255,255,255,.1);color:#fff}
nav button.on{background:rgba(255,255,255,.18);color:#fff}
nav button:focus-visible{outline:2px solid var(--green-400);outline-offset:2px}
main{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:2rem}
footer{background:var(--surface);border-top:.5px solid var(--line);padding:1rem 2rem;text-align:center;font-size:11px;color:var(--mut)}
label{display:block;margin:.5rem 0 .2rem;color:var(--fg);font-size:12.5px;font-weight:600}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;min-height:38px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);padding:.4rem .75rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:var(--focus)}
input[type=checkbox]{min-height:0}
textarea{min-height:8rem;font:12px/1.5 ui-monospace,Consolas,monospace}
button{padding:7px 16px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--indigo-800);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{border-color:var(--acc);color:var(--acc);background:var(--ink-50)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri:hover{background:var(--indigo-700);border-color:var(--indigo-700);color:#fff;box-shadow:0 14px 30px rgba(69,29,199,.3)}
button:focus-visible{outline:none;box-shadow:var(--focus)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.75rem}
.bar{display:flex;gap:.6rem;align-items:center;margin:.8rem 0;flex-wrap:wrap}
.bar label{margin:0;font-weight:500;color:var(--mut)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.9rem 1.1rem;margin:.6rem 0;box-shadow:var(--shadow)}
.mut{color:var(--mut)}.err{color:var(--red)}.ok{color:var(--green-700)}
code{background:var(--indigo-50);color:var(--indigo-800);padding:0 .3rem;border-radius:4px}
table{border-collapse:collapse;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{font:600 11px Inter,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);background:var(--ink-50)}
th,td{border-bottom:1px solid var(--line);padding:.5rem .7rem;text-align:left;vertical-align:top}
td input,td select{min-height:30px;padding:.15rem .4rem}
td select{min-width:7.5rem}td input[type=checkbox]{width:auto}td label{display:inline-block;white-space:nowrap;margin:0 .4rem 0 0;font-weight:500}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;background:var(--indigo-50);color:var(--indigo-800);font-size:11px;font-weight:500;margin:1px}
.tag.cov{background:var(--green-50);color:var(--green-700)}.tag.part{background:var(--amber-bg);color:#8A4800}.tag.gap{background:var(--red-bg);color:#a02a29}
.mtools{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:.4rem 0 .6rem}
.mtools input{width:16rem}.mtools select{width:auto;max-width:18rem}
.lg{font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px;margin-left:.3rem;border:1px solid var(--line-strong);color:var(--ink-900)}
.lg.cov{background:var(--green-400);border-color:var(--green-400)}.lg.part{background:var(--amber-bg);border-color:var(--amber)}
.lg.gap{background:var(--red-bg);border-color:var(--red)}.lg.none{color:var(--mut)}
.matrix{display:flex;gap:6px;overflow:auto;align-items:flex-start;max-height:calc(100vh - 200px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 8px 8px}
.col{min-width:132px;flex:1}
.col h3{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:4px;font:600 12px Poppins,sans-serif;margin:0 0 6px;padding:10px 6px 6px;color:var(--indigo-800);background:var(--surface);border-bottom:2px solid var(--indigo-600)}
.col h3 span{font:500 11px Inter,sans-serif;color:var(--mut)}
.cell{display:block;width:100%;text-align:left;font:11px/1.3 Inter,sans-serif;padding:4px 6px;margin:0 0 3px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--mut)}
.cell b{font-weight:600;color:var(--fg)}.cell i{float:right;font-style:normal;font-weight:600}.cell span{display:block}
.cell:hover{border-color:var(--acc);background:var(--indigo-50);color:var(--fg)}
.cell.cov{background:var(--green-400);border-color:var(--green-400);color:var(--ink-900)}
.cell.part{background:var(--amber-bg);border-color:var(--amber);color:var(--ink-900)}
.cell.gap{background:var(--red-bg);border-color:var(--red);color:var(--ink-900)}
.cell.rel{box-shadow:inset 3px 0 0 var(--indigo-600)}.cell.gap.rel{box-shadow:inset 3px 0 0 var(--red)}
.cell.cov:hover,.cell.part:hover,.cell.gap:hover{filter:brightness(.95);border-color:var(--indigo-600)}
#detail{position:fixed;top:56px;right:0;bottom:0;width:min(380px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(22,18,31,.12);padding:1rem 1.2rem;overflow:auto;transform:translateX(105%);transition:transform .2s ease;z-index:20}
#detail.open{transform:none}
#detail h3{font-size:1rem;margin:.2rem 1.6rem .4rem 0;color:var(--indigo-800)}#detail h4{font-size:.85rem;margin:1.1rem 0 .3rem}
#detail .x{position:absolute;top:.6rem;right:.8rem;padding:0 .6rem;font-size:1.2rem;line-height:1.6}
#detail .item{padding:.35rem 0;border-bottom:1px solid var(--line)}#detail .item.sub{font-size:12px}
@media(prefers-reduced-motion:reduce){#detail{transition:none}}
.gap{color:var(--red)}.part{color:#8A4800}.cov{color:var(--green-700)}
@media(max-width:700px){header{padding:0 1rem;flex-wrap:wrap;height:auto;padding-block:.5rem}main{padding:1rem}}
.sref{font-size:12px;background:var(--indigo-600);color:#fff;margin:0 0 .3rem}
.mwrap{overflow:auto;max-height:calc(100vh - 250px);border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rm{border:0;border-radius:0}
.rm th{position:sticky;top:0;z-index:2}
.rm tbody tr{cursor:pointer}.rm tbody tr:hover{background:var(--indigo-50)}.rm tr.sel{background:var(--indigo-50);box-shadow:inset 3px 0 0 var(--indigo-600)}
.rm th.sc,.rm td.lk{text-align:center;padding:.2rem .1rem}.rm th.sc{cursor:pointer}
.rm th.hl,.rm td.hl{background:var(--indigo-50)}
.rm td.lk button{border:0;background:none;padding:2px 7px;font-size:15px;border-radius:4px;color:var(--ink-200)}
.rm td.ok button{color:var(--green-700)}.rm td.suspect button{color:var(--red);background:var(--red-bg)}.rm td.miss button{color:var(--amber)}
.rm tfoot td{font-size:12px;text-align:center;background:var(--ink-50);position:sticky;bottom:0}.rm tfoot td:first-child{text-align:left}
.rm tfoot .zero{color:var(--red);font-weight:600}
.lg.flt{cursor:pointer;background:var(--surface)}.lg.flt.on{outline:2px solid var(--acc);color:var(--indigo-800)}
.tag .rmt{border:0;background:none;padding:0 0 0 4px;font-size:12px;color:var(--mut)}
#detail pre{background:var(--ink-50);border:1px solid var(--line);border-radius:8px;padding:.6rem;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:16rem;overflow:auto}
#detail .item button{margin-top:.3rem;padding:2px 10px;font-size:12px}
details#imp summary{cursor:pointer;margin:.4rem 0}
@media(min-width:1100px){main:has(#detail.open){padding-right:420px}}
label.chk{display:flex;gap:.5rem;align-items:flex-start;margin:.5rem 0;font-weight:500;color:var(--fg)}
label.chk input{width:auto;min-height:0;margin-top:.2rem}
.pill{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--ink-100);color:var(--mut)}
.pill.ok{background:var(--green-50);color:var(--green-700)}.pill.warn{background:var(--amber-bg);color:#8A4800}.pill.error{background:var(--red-bg);color:#a02a29}.pill.busy{background:var(--indigo-50);color:var(--indigo-800)}
[hidden]{display:none!important}
.lang{margin-left:.8rem;padding:4px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:rgba(255,255,255,.85);font-size:12px;font-weight:500}
.lang:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.6);color:#fff}

globalThis.__SAMPLES__ = {"cti.txt":"Rapport de menace (exemple) - Secteur santé, Europe\n\nLes opérateurs de ransomware ciblent les hôpitaux et groupes de cliniques. L'accès initial est obtenu par spearphishing avec pièces jointes (macros, ISO/LNK) ou par exploitation de VPN/pare-feux exposés non patchés. Les attaquants utilisent des comptes valides achetés auprès d'initial access brokers.\nAprès l'accès : exécution PowerShell, déploiement de Cobalt Strike, dump LSASS (Mimikatz), Kerberoasting, mouvement latéral via RDP et PsExec/SMB, désactivation de l'EDR et suppression des shadow copies (vssadmin), exfiltration vers du stockage cloud (Rclone/MEGA) avant chiffrement des serveurs ESXi et des partages de fichiers.\nPar ailleurs, des campagnes d'espionnage étatique visent la recherche médicale : compromission de la chaîne d'approvisionnement logicielle, web shells sur serveurs Exchange exposés, persistance par tâches planifiées et exfiltration lente par HTTPS.\n","rules.yml":"title: Suspicious PowerShell Encoded Command\ntags:\n  - attack.execution\n  - attack.t1059.001\nlogsource: {product: windows, category: process_creation}\ndetection:\n  selection: {Image|endswith: '\\powershell.exe', CommandLine|contains: ['-enc ', '-EncodedCommand']}\n  condition: selection\n---\ntitle: LSASS Memory Access by Non-System Process\ntags:\n  - attack.credential-access\n  - attack.t1003.001\nlogsource: {product: windows, category: process_access}\ndetection:\n  selection: {TargetImage|endswith: '\\lsass.exe', GrantedAccess|contains: ['0x1010', '0x1410']}\n  condition: selection\n---\ntitle: Shadow Copies Deletion via Vssadmin\ntags:\n  - attack.impact\n  - attack.t1490\nlogsource: {product: windows, category: process_creation}\ndetection:\n  selection: {Image|endswith: '\\vssadmin.exe', CommandLine|contains|all: ['delete', 'shadows']}\n  condition: selection\n---\ntitle: PsExec Service Installation\ntags:\n  - attack.execution\n  - attack.t1569.002\nlogsource: {product: windows, service: system}\ndetection:\n  selection: {EventID: 7045, ServiceName: 'PSEXESVC'}\n  condition: selection\n---\ntitle: Office Application Spawning Script Interpreter\ntags:\n  - attack.execution\n  - attack.t1204.002\nlogsource: {product: windows, category: process_creation}\ndetection:\n  selection: {ParentImage|endswith: ['\\winword.exe', '\\excel.exe'], Image|endswith: ['\\cmd.exe', '\\powershell.exe', '\\wscript.exe']}\n  condition: selection\n---\ntitle: Rclone Execution with Remote Config\nlogsource: {product: windows, category: process_creation}\ndetection:\n  selection: {CommandLine|contains: ['rclone', ' copy ', ' sync ']}\n  condition: selection\n---\ntitle: Kerberoasting - Multiple TGS Requests with RC4\nlogsource: {product: windows, service: security}\ndetection:\n  selection: {EventID: 4769, TicketEncryptionType: '0x17'}\n  condition: selection | count(ServiceName) by IpAddress > 10\n","project.json":"{\n \"client\": {\n  \"sector\": \"Santé (hôpitaux)\",\n  \"size\": \"ETI 3000 employés\",\n  \"country\": \"France / Europe\",\n  \"assets\": \"SI hospitalier, ESXi, dossiers patients\"\n },\n \"cti\": \"Rapport de menace (exemple) - Secteur santé, Europe\\n\\nLes opérateurs de ransomware ciblent les hôpitaux et groupes de cliniques. L'accès initial est obtenu par spearphishing avec pièces jointes (macros, ISO/LNK) ou par exploitation de VPN/pare-feux exposés non patchés. Les attaquants utilisent des comptes valides achetés auprès d'initial access brokers.\\nAprès l'accès : exécution PowerShell, déploiement de Cobalt Strike, dump LSASS (Mimikatz), Kerberoasting, mouvement latéral via RDP et PsExec/SMB, désactivation de l'EDR et suppression des shadow copies (vssadmin), exfiltration vers du stockage cloud (Rclone/MEGA) avant chiffrement des serveurs ESXi et des partages de fichiers.\\nPar ailleurs, des campagnes d'espionnage étatique visent la recherche médicale : compromission de la chaîne d'approvisionnement logicielle, web shells sur serveurs Exchange exposés, persistance par tâches planifiées et exfiltration lente par HTTPS.\\n\",\n \"scenarios\": [\n  {\n   \"name\": \"Ransomware via spearphishing avec pièce jointe malveillante\",\n   \"actors\": \"Opérateurs de ransomware ciblant le secteur santé\",\n   \"summary\": \"Compromission initiale par email de phishing contenant document à macro ou fichier ISO/LNK, suivie d'un chargement de payload, vol d'identifiants, mouvement latéral puis chiffrement des serveurs et partages hospitaliers.\",\n   \"techniques\": [\n    \"T1566.001\",\n    \"T1204.002\",\n    \"T1059.001\",\n    \"T1105\",\n    \"T1003.001\",\n    \"T1558.003\",\n    \"T1021.001\",\n    \"T1021.002\",\n    \"T1685\",\n    \"T1490\",\n    \"T1486\"\n   ],\n   \"priority\": \"high\",\n   \"rationale\": \"Vecteur explicitement observé contre les hôpitaux européens. Impact critique sur la disponibilité des dossiers patients et de l'activité de soins.\",\n   \"id\": \"vkkwclf\",\n   \"rejected\": []\n  },\n  {\n   \"name\": \"Exploitation de VPN ou pare-feu exposé menant à un ransomware\",\n   \"actors\": \"Opérateurs de ransomware\",\n   \"summary\": \"Exploitation d'un équipement exposé non corrigé pour obtenir un accès initial, déployer Cobalt Strike, se propager dans le domaine puis chiffrer l'infrastructure.\",\n   \"techniques\": [\n    \"T1190\",\n    \"T1078\",\n    \"T1059.001\",\n    \"T1046\",\n    \"T1087.002\",\n    \"T1003.001\",\n    \"T1021.001\",\n    \"T1570\",\n    \"T1685\",\n    \"T1490\",\n    \"T1486\"\n   ],\n   \"priority\": \"high\",\n   \"rationale\": \"Les équipements exposés sont cités comme vecteur fréquent. Les hôpitaux possèdent souvent de nombreux accès distants critiques.\",\n   \"id\": \"lijlu94\",\n   \"rejected\": []\n  },\n  {\n   \"name\": \"Utilisation de comptes valides achetés auprès d'Initial Access Brokers\",\n   \"actors\": \"Ransomware-as-a-Service (RaaS)\",\n   \"summary\": \"Connexion avec des comptes déjà compromis, exploration de l'environnement, élévation de privilèges et préparation d'une attaque d'extorsion double.\",\n   \"techniques\": [\n    \"T1078\",\n    \"T1133\",\n    \"T1087.002\",\n    \"T1069.002\",\n    \"T1482\",\n    \"T1003.001\",\n    \"T1550\",\n    \"T1021.001\",\n    \"T1567.002\",\n    \"T1486\"\n   ],\n   \"priority\": \"high\",\n   \"rationale\": \"Le rapport indique explicitement l'usage de comptes achetés. Les identités privilégiées donnent rapidement accès aux SI hospitaliers.\",\n   \"id\": \"2xe2f60\",\n   \"rejected\": []\n  },\n  {\n   \"name\": \"Double extorsion avec exfiltration vers stockage cloud\",\n   \"actors\": \"Groupes de ransomware\",\n   \"summary\": \"Collecte des dossiers patients et données sensibles avant chiffrement, avec exfiltration via services cloud de type Rclone ou MEGA.\",\n   \"techniques\": [\n    \"T1039\",\n    \"T1213\",\n    \"T1005\",\n    \"T1074.001\",\n    \"T1560.001\",\n    \"T1020\",\n    \"T1567.002\",\n    \"T1041\",\n    \"T1486\"\n   ],\n   \"priority\": \"high\",\n   \"rationale\": \"Les dossiers patients représentent une cible à forte valeur et un risque réglementaire élevé au regard du contexte hospitalier.\",\n   \"id\": \"fkcufn8\",\n   \"rejected\": []\n  },\n  {\n   \"name\": \"Chiffrement des hyperviseurs ESXi\",\n   \"actors\": \"Opérateurs de ransomware\",\n   \"summary\": \"Après compromission de l'environnement, les attaquants ciblent les serveurs ESXi afin d'interrompre massivement les services cliniques virtualisés.\",\n   \"techniques\": [\n    \"T1078\",\n    \"T1018\",\n    \"T1673\",\n    \"T1675\",\n    \"T1489\",\n    \"T1490\",\n    \"T1486\",\n    \"T1529\"\n   ],\n   \"priority\": \"high\",\n   \"rationale\": \"Les actifs ESXi sont explicitement mentionnés dans le profil client et dans le rapport de menace. Impact opérationnel maximal.\",\n   \"id\": \"510znye\",\n   \"rejected\": []\n  },\n  {\n   \"name\": \"Compromission d'Exchange exposé avec web shell\",\n   \"actors\": \"Groupes d'espionnage étatique\",\n   \"summary\": \"Exploitation d'un serveur Exchange exposé, déploiement d'un web shell, collecte d'informations stratégiques puis exfiltration discrète.\",\n   \"techniques\": [\n    \"T1190\",\n    \"T1505.003\",\n    \"T1059.001\",\n    \"T1114.001\",\n    \"T1083\",\n    \"T1213\",\n    \"T1053.005\",\n    \"T1071.001\",\n    \"T1041\"\n   ],\n   \"priority\": \"medium\",\n   \"rationale\": \"Le rapport mentionne spécifiquement ce mode opératoire dans les campagnes d'espionnage visant la recherche médicale.\",\n   \"id\": \"xkw0c4h\",\n   \"rejected\": []\n  },\n  {\n   \"name\": \"Espionnage de la recherche médicale via chaîne d'approvisionnement logicielle\",\n   \"actors\": \"Acteurs étatiques\",\n   \"summary\": \"Introduction d'un composant logiciel compromis dans l'environnement hospitalier afin de maintenir un accès durable et d'exfiltrer les données de recherche.\",\n   \"techniques\": [\n    \"T1195\",\n    \"T1105\",\n    \"T1059.001\",\n    \"T1053.005\",\n    \"T1082\",\n    \"T1083\",\n    \"T1213\",\n    \"T1071.001\",\n    \"T1573\",\n    \"T1041\"\n   ],\n   \"priority\": \"medium\",\n   \"rationale\": \"Moins probable que le ransomware mais pertinent pour les établissements impliqués dans la recherche ou les essais cliniques.\",\n   \"id\": \"nm9bew3\",\n   \"rejected\": []\n  },\n  {\n   \"name\": \"Persistance discrète par tâches planifiées et exfiltration HTTPS lente\",\n   \"actors\": \"Groupes d'espionnage étatique\",\n   \"summary\": \"Maintien d'accès durable sur plusieurs mois grâce à des tâches planifiées et extraction progressive de données via HTTPS afin d'éviter la détection.\",\n   \"techniques\": [\n    \"T1053.005\",\n    \"T1083\",\n    \"T1005\",\n    \"T1074.001\",\n    \"T1029\",\n    \"T1071.001\",\n    \"T1573\",\n    \"T1041\"\n   ],\n   \"priority\": \"medium\",\n   \"rationale\": \"TTP explicitement décrit. Risque élevé pour la confidentialité mais impact opérationnel plus limité qu'un ransomware.\",\n   \"id\": \"2d69mj8\",\n   \"   <h2>${t('Écarts priorisés')}</h2><table><thead><tr><th>${t('Technique')}</th><th>${t('Statut')}</th><th>${t('Scénarios concernés')}</th></tr></thead><tbody>${gapRows || `<tr><td colspan=3 class="mut">${t('Aucun écart')}</td></tr>`}</tbody></table>`;

  function drawMatrix() {

    const keep = (te, k) => (!q || (te.id + ' ' + te.name).toLowerCase().includes(q))
      && (view.show === 'all' || (view.show === 'scenario' && rel.has(te.id)) || (view.show === 'gap' && k === 'gap') || (view.show === 'cov' && k === 'cov'));

      return `<div class="col"><h3>${esc(tc.name)}${relAll.length ? `<span title="${t('Techniques de scénario couvertes dans cette tactique')}">${relCov.length}/${relAll.length}</span>` : ''}</h3>${cells.map(te => {
        const k = kind(te, rel), e = cm.get(te.id);

      }).join('')}</div>`;

    $(root, '#legend').innerHTML = `<span class="lg cov">${t('Couvert')} ${n.cov}</span><span class="lg part">${t('Partiel')} ${n.part}</span><span class="lg gap">${t('Écart')} ${n.gap}</span><span class="lg none">${t('Hors scénarios')}</span>`;

    const rules = e ? e.items.map(r => `<div class="item"><b>${esc(r.name)}</b><div class="mut">${r.techniques.map(x => `<span class="tag">${x}</span>`).join('')} ${esc(r.confidence || '')}${r.stage ? ' · ' + esc(r.stage) : ''}</div></div>`).join('') : `<p class="mut">${t('Aucune règle ne cible cette technique.')}</p>`;
    const scn = scs.map(s => `<div class="item">${esc(s.name)} <span class="tag">${esc(s.priority)}</span></div>`).join('') || `<p class="mut">${t('Aucun scénario ne l’utilise.')}</p>`;
    const sub = subs.map(x => { const c = cm.get(x.id); return `<div class="item sub"><span class="tag ${c ? (c.best >= 2 ? 'cov' : 'part') : ''}">${x.id}</span> ${esc(x.name)}${c ? ` <span class="mut">×${c.n}</span>` : ''}</div>`; }).join('') || `<p class="mut">${t('Aucune.')}</p>`;
    const d = $(root, '#detail');
    d.innerHTML = `<button class="x" aria-label="${t('Fermer')}">×</button><h3>${id} ${esc(te.name)}</h3>
      <p><span class="tag ${st[0]}">${st[1]}</span> <a href="https://attack.mitre.org/techniques/${id}/" target="_blank" rel="noopener">${t('Fiche MITRE')}</a></p>
      <h4>${t('Règles')} (${e ? e.items.length : 0})</h4>${rules}<h4>${t('Scénarios')} (${scs.length})</h4>${scn}<h4>${t('Sous-techniques ({n}/{m} couvertes)', { n: subs.filter(x => (cm.get(x.id)?.exact || 0) >= 2).length, m: subs.length })}</h4>${sub}`;
    d.classList.add('open'); $(d, '.x').focus();
  }

  $(root, '#q').value = view.q; $(root, '#msc').value = view.sc; $(root, '#mshow').value = view.show;
  $(root, '#q').oninput = e => { view.q = e.target.value; drawMatrix(); };
  $(root, '#msc').onchange = e => { view.sc = e.target.value; drawMatrix(); };
  $(root, '#mshow').onchange = e => { view.show = e.target.value; drawMatrix(); };
  $(root, '#matrix').onclick = e => { const c = e.target.closest('.cell'); if (c) openDetail(c.dataset.id); };
  $(root, '#detail').onclick = e => { if (e.target.classList.contains('x')) e.currentTarget.classList.remove('open'); };
  root.onkeydown = e => { if (e.key === 'Escape') $(root, '#detail').classList.remove('open'); };
  drawMatrix();
  const demo = $(root, '#demo'); if (demo) demo.onclick = async () => { await loadDemo(); showProject(); render(root); };

  const slug = state.name.normalize('NFD').replace(/[^\w]+/g, '-').replace(/^-|-$/g, '').toLowerCase() || 'projet';
  const html = () => new Blob([reportHtml(analysis())], { type: 'text/html' });
  $(root, '#rep').onclick = () => { const w = window.open(URL.createObjectURL(html())); if (!w) alert(t('Fenêtre bloquée : autorise les pop-ups ou utilise « Rapport (HTML) ».')); };
  $(root, '#reph').onclick = () => download(`mitremapper-${t('rapport')}-${slug}.html`, html());
  $(root, '#xlsx').onclick = () => download(`mitremapper-${slug}.xlsx`, workbook(analysis()));
  // couche du scénario sélectionné dans le filtre, sinon couche globale
  $(root, '#nav').onclick = () => { const s = state.scenarios.find(x => x.id === view.sc); exportJson(`mitremapper-layer-${s ? sref(s) : 'global'}.json`, layer(analysis(), s)); };
  $(root, '#navz').onclick = () => download(`mitremapper-layers-${slug}.zip`, layersZip(analysis()));
  $(root, '#csv').onclick = () => {
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`, sc = id => state.scenarios.find(s => s.id === id)?.name;
    exportJson('mitremapper-rules.csv', [t('règle,source,techniques,scénarios,étape,confiance,note'),
      ...state.rules.map(r => [r.name, r.source, r.techniques.join(' '), r.scenarios.map(sc).join(' | '), r.stage, r.confidence, r.note].map(q).join(','))].join('\n'));
  };
}

return { coverageMap, status, LABEL, analysis, render };
})();
